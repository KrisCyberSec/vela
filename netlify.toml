# Netlify config for velahealth.health — the public marketing site
# plus the API functions used by the iOS app.
#
# The React app (src/, build/) is NOT served from this domain.
# It's bundled into the iOS Capacitor app — `webDir: 'build'` in
# capacitor.config.ts — and never deployed to the web.
#
# This config covers:
#   - publish = "landing"           the marketing site (velahealth.health)
#   - functions in netlify/functions/
#       - waitlist, waitlist-export   used by landing/admin.html
#       - ask-vela, daily-brief       called by the iOS app over HTTPS
#
# Deploy through `npm run deploy:netlify` from the repo root. The script
# stages only this config, landing/, package files, and netlify/functions/.

[build]
  publish = "landing"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Functions need Anthropic SDK shape; bundling with esbuild keeps cold
# starts fast and avoids the legacy zisi packager.

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true
