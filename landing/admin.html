<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vela — Waitlist Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root {
      --clay: #C4856C; --sage: #7A9E87; --sage-dark: #5A7E67;
      --cream: #FAF6F1; --ink: #2C1F17; --ink-mid: #6B5347; --ink-light: #9A8578;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--cream); color: var(--ink); padding: 32px 24px; line-height: 1.5;
    }
    .wrap { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 28px; margin-bottom: 4px; color: var(--ink); }
    .sub { color: var(--ink-mid); margin-bottom: 24px; font-size: 14px; }
    .stats {
      display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .stat {
      background: white; border-radius: 12px; padding: 16px 20px; flex: 1; min-width: 160px;
      border: 1px solid rgba(0,0,0,0.08);
    }
    .stat-num { font-size: 28px; font-weight: 600; color: var(--clay); }
    .stat-label { font-size: 12px; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    .actions { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .btn {
      padding: 8px 16px; background: var(--ink); color: var(--cream);
      border: none; border-radius: 8px; font-size: 13px; font-weight: 500;
      cursor: pointer; text-decoration: none; display: inline-block;
    }
    .btn:hover { opacity: 0.9; }
    .btn.secondary { background: white; color: var(--ink); border: 1px solid rgba(0,0,0,0.15); }
    table {
      width: 100%; background: white; border-radius: 12px; overflow: hidden;
      border-collapse: collapse; border: 1px solid rgba(0,0,0,0.08);
    }
    thead { background: var(--sage); color: white; }
    th, td {
      padding: 12px 16px; text-align: left; font-size: 14px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    th { font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    tbody tr:hover { background: rgba(0,0,0,0.02); }
    tbody tr:last-child td { border-bottom: none; }
    .email { font-family: ui-monospace, 'SF Mono', monospace; font-size: 13px; color: var(--ink); }
    .date { color: var(--ink-mid); font-size: 13px; }
    .ref { color: var(--ink-light); font-size: 12px; }
    .login {
      max-width: 400px; margin: 80px auto; background: white; padding: 32px;
      border-radius: 12px; border: 1px solid rgba(0,0,0,0.08);
    }
    .login input {
      width: 100%; padding: 10px 14px; border: 1px solid rgba(0,0,0,0.15);
      border-radius: 8px; font-size: 14px; margin: 12px 0 16px;
      font-family: inherit; color: var(--ink);
    }
    .login input:focus { outline: none; border-color: var(--sage); }
    .login button { width: 100%; padding: 12px; }
    .error { color: #C4575C; font-size: 13px; margin-bottom: 12px; }
    .empty {
      text-align: center; padding: 60px 20px; color: var(--ink-light);
      background: white; border-radius: 12px; border: 1px solid rgba(0,0,0,0.08);
    }
    .logout { float: right; font-size: 13px; color: var(--ink-light); text-decoration: none; }
    .logout:hover { color: var(--ink); }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>

  <script>
    const $ = (sel) => document.querySelector(sel);
    // sessionStorage (not localStorage) so token clears on tab close.
    const TOKEN_KEY = "vela_admin_token";
    const EXPORT_URL = "/.netlify/functions/waitlist-export";

    function authedFetch(token, url) {
      return fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    }

    function el(tag, attrs = {}, children = []) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") node.className = v;
        else if (k === "onclick") node.addEventListener("click", v);
        else node.setAttribute(k, v);
      }
      for (const c of [].concat(children)) {
        if (c == null) continue;
        node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      }
      return node;
    }

    function renderLogin(errMsg) {
      const app = $("#app");
      app.replaceChildren();
      const wrap = el("div", { class: "login" }, [
        el("h1", {}, "Vela Admin"),
        el("p", { class: "sub" }, "Enter your admin token to view the waitlist."),
      ]);
      if (errMsg) wrap.appendChild(el("div", { class: "error" }, errMsg));
      const input = el("input", { type: "password", id: "token-input", placeholder: "Admin token", autofocus: "", required: "" });
      const form = el("form", {}, [input, el("button", { type: "submit", class: "btn" }, "Unlock")]);
      form.addEventListener("submit", handleLogin);
      wrap.appendChild(form);
      app.appendChild(wrap);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const token = $("#token-input").value.trim();
      if (!token) return false;
      const ok = await tryLoad(token);
      if (ok) {
        sessionStorage.setItem(TOKEN_KEY, token);
      } else {
        renderLogin("Invalid token. Try again.");
      }
      return false;
    }

    function logout() {
      sessionStorage.removeItem(TOKEN_KEY);
      renderLogin();
    }

    async function tryLoad(token) {
      try {
        const r = await authedFetch(token, EXPORT_URL);
        if (!r.ok) return false;
        const data = await r.json();
        renderDashboard(data, token);
        return true;
      } catch {
        return false;
      }
    }

    function fmtDate(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      return d.toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }

    async function downloadCsv(token) {
      const r = await authedFetch(token, `${EXPORT_URL}?format=csv`);
      if (!r.ok) { alert("Download failed: " + r.status); return; }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "waitlist.csv";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function renderDashboard(data, token) {
      const entries = (data.entries || []).slice().reverse(); // newest first
      const now = Date.now();
      const last7d = entries.filter(e => new Date(e.submittedAt) > now - 7*86400000).length;

      const app = $("#app");
      app.replaceChildren();

      const header = el("div", {}, [
        el("a", { href: "#", class: "logout", onclick: (e) => { e.preventDefault(); logout(); } }, "Sign out"),
        el("h1", {}, "Waitlist"),
        el("p", { class: "sub" }, "velahealth.health signups"),
      ]);

      const stats = el("div", { class: "stats" }, [
        el("div", { class: "stat" }, [
          el("div", { class: "stat-num" }, String(data.count ?? 0)),
          el("div", { class: "stat-label" }, "Total signups"),
        ]),
        el("div", { class: "stat" }, [
          el("div", { class: "stat-num" }, String(last7d)),
          el("div", { class: "stat-label" }, "Last 7 days"),
        ]),
      ]);

      const actions = el("div", { class: "actions" }, [
        el("button", { class: "btn", onclick: () => downloadCsv(token) }, "Download CSV"),
        el("button", { class: "btn secondary", onclick: copyEmails }, "Copy all emails"),
        el("button", { class: "btn secondary", onclick: () => location.reload() }, "Refresh"),
      ]);

      app.append(header, stats, actions);

      if (entries.length === 0) {
        const empty = el("div", { class: "empty" }, [
          el("p", {}, "No signups yet."),
          el("p", { style: "margin-top:8px; font-size:13px;" }, [
            "Share your site: ",
            el("strong", {}, "velahealth.health"),
          ]),
        ]);
        app.appendChild(empty);
      } else {
        const tbody = el("tbody");
        for (const e of entries) {
          tbody.appendChild(el("tr", {}, [
            el("td", { class: "email" }, e.email ?? ""),
            el("td", { class: "date" }, fmtDate(e.submittedAt)),
            el("td", { class: "ref" }, e.referrer || "—"),
          ]));
        }
        const table = el("table", {}, [
          el("thead", {}, el("tr", {}, [
            el("th", {}, "Email"),
            el("th", {}, "Signed up"),
            el("th", {}, "Referrer"),
          ])),
          tbody,
        ]);
        app.appendChild(table);
      }

      window._emails = entries.map(e => e.email).join("\n");
    }

    window.copyEmails = async () => {
      if (window._emails) {
        await navigator.clipboard.writeText(window._emails);
        alert("Copied " + window._emails.split("\n").length + " emails to clipboard");
      }
    };

    // Boot
    const saved = sessionStorage.getItem(TOKEN_KEY);
    if (saved) {
      tryLoad(saved).then(ok => { if (!ok) renderLogin("Saved token no longer works. Please re-enter."); });
    } else {
      renderLogin();
    }
  </script>
</body>
</html>
